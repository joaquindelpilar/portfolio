": 94, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "A rapidly falling absolute lymphocyte count after suspected whole-body exposure suggests:", "options": {"A": "Improved immune function", "B": "Only a calibration error", "C": "Guaranteed absence of exposure", "D": "Significant marrow and lymphoid radiation injury"}, "correct": "D", "explanations": {"A": "Incorrect. Falling lymphocytes indicate impaired, not improved, immune capacity.", "B": "Incorrect. Clinical laboratory trends are biological data, not merely equipment calibration.", "C": "Incorrect. A rapid fall supports rather than excludes substantial exposure.", "D": "Correct. Lymphocyte depletion kinetics are used with symptoms and cytogenetics in triage."}, "source": "IAEA Handbook, Sec. 4.3.4"}, {"id": 95, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "The classic multistage model of carcinogenesis is ordered as:", "options": {"A": "Promotion → repair → exposure", "B": "Progression → initiation → prevention", "C": "Latency → shielding → ionization", "D": "Initiation → promotion → progression"}, "correct": "D", "explanations": {"A": "Incorrect. Repair and exposure are not the standard three stages.", "B": "Incorrect. Progression follows initiation and promotion.", "C": "Incorrect. These are not the stages of carcinogenesis.", "D": "Correct. Initiation introduces a critical alteration, promotion expands altered cells, and progression adds malignant traits."}, "source": "Biological Effects slides, pp. 68-73; IAEA Handbook, Sec. 4.4.1"}, {"id": 96, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "Why can an individual radiation-induced cancer rarely be identified as radiation-caused on clinical appearance alone?", "options": {"A": "All radiation-induced cancers glow under visible light", "B": "Radiation never causes cancer", "C": "Radiation-induced and spontaneous cancers are generally morphologically and biochemically indistinguishable", "D": "Only hereditary diseases can follow radiation"}, "correct": "C", "explanations": {"A": "Incorrect. No such universal clinical marker exists.", "B": "Incorrect. Ionizing radiation is an established carcinogen.", "C": "Correct. Attribution is mainly epidemiological because the tumour itself usually lacks a unique radiation signature.", "D": "Incorrect. Somatic cancers are a major stochastic concern."}, "source": "Biological Effects slides, p. 102"}, {"id": 97, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "A cohort study of radiation effects typically compares:", "options": {"A": "One patient before and after an X-ray image without follow-up", "B": "Disease occurrence in exposed and less-exposed or unexposed groups followed over time", "C": "Only laboratory animals with no dose information", "D": "Machine output in two hospitals without health outcomes"}, "correct": "B", "explanations": {"A": "Incorrect. A single patient observation cannot estimate population risk reliably.", "B": "Correct. Cohort designs estimate incidence or mortality according to exposure status or dose.", "C": "Incorrect. Human epidemiology requires defined populations and exposure assessment.", "D": "Incorrect. Health outcomes are essential for epidemiological inference."}, "source": "Biological Effects slides, pp. 85-88"}, {"id": 98, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "The Life Span Study of Japanese atomic-bomb survivors is important because it provides:", "options": {"A": "Only information on non-ionizing radiation", "B": "A randomized clinical trial of radiation exposure", "C": "Proof that all low doses are harmless", "D": "Long-term dose-related evidence on leukemia and solid-cancer risks"}, "correct": "D", "explanations": {"A": "Incorrect. The exposure involved ionizing radiation.", "B": "Incorrect. The bombing was not a randomized experiment.", "C": "Incorrect. The study does not prove zero risk at low dose.", "D": "Correct. The cohort has supplied major quantitative evidence on cancer incidence and mortality across decades."}, "source": "Biological Effects slides, pp. 86-92; IAEA Handbook, Sec. 4.4.3"}, {"id": 99, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "The primary radiation-protection strategy for deterministic tissue reactions is to:", "options": {"A": "Accept any dose because severity is dose independent", "B": "Keep organ doses below relevant thresholds", "C": "Use tissue weighting factors to make the physical injury disappear", "D": "Ignore local skin dose"}, "correct": "B", "explanations": {"A": "Incorrect. Their severity generally increases above threshold.", "B": "Correct. Threshold tissue reactions can largely be prevented by dose limitation and optimization.", "C": "Incorrect. Weighting factors estimate risk; they do not undo injury.", "D": "Incorrect. Local tissue dose is critical for skin and lens reactions."}, "source": "IAEA Handbook, Secs. 4.1 and 4.7"}, {"id": 100, "section": "10. Radiation Carcinogenesis, Epidemiology and Radiation Protection", "stem": "For stochastic effects, radiation protection aims mainly to:", "options": {"A": "Increase dose rate to shorten exposure", "B": "Reduce probability to an acceptably low level through justification and optimization", "C": "Keep dose above a tissue threshold", "D": "Guarantee that no cancer can ever occur"}, "correct": "B", "explanations": {"A": "Incorrect. Higher dose rate can increase biological effect for low-LET radiation.", "B": "Correct. Because no practical zero-risk threshold is assumed, protection reduces unnecessary exposure and balances benefit and risk.", "C": "Incorrect. Dose should not be deliberately kept above a threshold.", "D": "Incorrect. No system can guarantee zero spontaneous or radiation-related cancer."}, "source": "IAEA Handbook, Secs. 4.1 and 4.7"}, {"id": 101, "section": "11. Prenatal and Heritable Effects", "stem": "Radiation exposure during the preimplantation period is classically associated with:", "options": {"A": "No biological sensitivity", "B": "An all-or-none response: embryonic death or survival without major malformation", "C": "Only cataract formation", "D": "A specific limb defect in every exposed embryo"}, "correct": "B", "explanations": {"A": "Incorrect. Early embryos can be highly sensitive to lethal effects.", "B": "Correct. At this very early stage, loss of enough cells may prevent implantation, while surviving embryos can often compensate.", "C": "Incorrect. Cataract is not the characteristic preimplantation outcome.", "D": "Incorrect. Specific malformations are more linked to organogenesis and depend on dose and timing."}, "source": "Biological Effects slides, pp. 81-82; IAEA Handbook, Sec. 2.6.6"}, {"id": 102, "section": "11. Prenatal and Heritable Effects", "stem": "Exposure during organogenesis is most strongly associated with increased risk of:", "options": {"A": "Immediate neurovascular syndrome in the mother at any dose", "B": "Structural congenital malformations", "C": "Only adult-onset leukemia with no developmental effects", "D": "A reduction in all spontaneous abnormalities to zero"}, "correct": "B", "explanations": {"A": "Incorrect. Maternal ARS requires high maternal whole-body dose, not simply organogenesis exposure.", "B": "Correct. Organ systems are forming, so injury can produce stage-specific structural abnormalities.", "C": "Incorrect. Cancer risk may exist, but malformation is the key timing-specific deterministic concern.", "D": "Incorrect. Radiation does not eliminate background developmental abnormalities."}, "source": "IAEA Handbook, Sec. 2.6.6"}, {"id": 103, "section": "11. Prenatal and Heritable Effects", "stem": "The period of greatest concern for radiation-related severe intellectual impairment is approximately:", "options": {"A": "After birth only", "B": "Only the day before conception", "C": "After age 50", "D": "8-15 weeks after conception, with continued sensitivity to about 25 weeks"}, "correct": "D", "explanations": {"A": "Incorrect. Prenatal CNS sensitivity occurs before birth.", "B": "Incorrect. Preconception exposure is not the same developmental window.", "C": "Incorrect. This is not a fetal developmental period.", "D": "Correct. The developing central nervous system is especially sensitive during early fetal brain development, particularly 8-15 weeks."}, "source": "Biological Effects slides, p. 83; IAEA Handbook, Sec. 4.6"}, {"id": 104, "section": "11. Prenatal and Heritable Effects", "stem": "A heritable radiation effect is one that:", "options": {"A": "Is always a deterministic effect with a threshold", "B": "Can be diagnosed by measuring absorbed dose alone", "C": "Results from germ-cell mutation and is expressed in descendants", "D": "Occurs only in the irradiated person’s skin"}, "correct": "C", "explanations": {"A": "Incorrect. Heritable effects are treated as stochastic in radiation protection.", "B": "Incorrect. Dose contributes to risk estimation but does not by itself diagnose a specific inherited disease.", "C": "Correct. Heritable effects arise when mutations in sperm or ova are transmitted to offspring.", "D": "Incorrect. A skin reaction is somatic."}, "source": "Biological Effects slides, p. 46; IAEA Handbook, Secs. 2.6.7 and 4.5"}, {"id": 105, "section": "11. Prenatal and Heritable Effects", "stem": "The “doubling dose” in genetic risk assessment is the dose estimated to:", "options": {"A": "Reduce mutation frequency by half", "B": "Cause death in 50% of an exposed population", "C": "Produce as many additional heritable mutations as occur spontaneously in one generation", "D": "Double the absorbed dose in every organ automatically"}, "correct": "C", "explanations": {"A": "Incorrect. It concerns an increase, not a reduction, in mutation frequency.", "B": "Incorrect. That describes an LD50 concept.", "C": "Correct. It compares radiation-induced heritable mutation burden with the natural background mutation rate.", "D": "Incorrect. It is a risk concept, not an automatic physical dose multiplier."}, "source": "IAEA Handbook, Sec. 2.6.7"}, {"id": 106, "section": "12. Advanced Integrated Topics", "stem": "A radiation sensitizer is intended to:", "options": {"A": "Increase radiation damage in the target, ideally with tumour selectivity", "B": "Convert ionizing radiation to non-ionizing radiation", "C": "Reduce absorbed dose to zero", "D": "Protect every cell equally from radiation"}, "correct": "A", "explanations": {"A": "Correct. Sensitizers increase biological effect, for example by mimicking oxygen or inhibiting repair pathways.", "B": "Incorrect. It does not change the fundamental radiation type.", "C": "Incorrect. Sensitization changes biological response, not necessarily physical absorbed dose.", "D": "Incorrect. That describes a protector rather than a sensitizer."}, "source": "IAEA Handbook, Sec. 2.3.12"}, {"id": 107, "section": "12. Advanced Integrated Topics", "stem": "An ideal radiation protector would:", "options": {"A": "Increase tumour radioresistance more than normal-tissue resistance", "B": "Prevent dosimetry measurements", "C": "Increase DNA radical formation in normal tissues", "D": "Reduce normal-tissue injury without equally protecting the tumour"}, "correct": "D", "explanations": {"A": "Incorrect. Greater tumour protection would undermine treatment.", "B": "Incorrect. A protector should not interfere with measuring delivered dose.", "C": "Incorrect. Increasing radicals would worsen injury.", "D": "Correct. Selective normal-tissue protection improves the therapeutic ratio."}, "source": "IAEA Handbook, Sec. 2.3.13"}, {"id": 108, "section": "12. Advanced Integrated Topics", "stem": "Spatial cooperation in combined cancer treatment means:", "options": {"A": "Normal tissue and tumour always receive identical doses", "B": "Two drugs must bind the same DNA base", "C": "Different modalities control disease in different anatomical sites without necessarily interacting in the same cells", "D": "Radiation fields are delivered on different days to reduce repair"}, "correct": "C", "explanations": {"A": "Incorrect. Treatment planning aims to create differential dose and effect.", "B": "Incorrect. Molecular co-binding is not required for spatial cooperation.", "C": "Correct. For example, radiotherapy may control a primary tumour while systemic therapy treats distant micrometastases.", "D": "Incorrect. Field timing is a fractionation issue and may create undesirable unequal repair."}, "source": "IAEA Handbook, Sec. 3.14"}, {"id": 109, "section": "12. Advanced Integrated Topics", "stem": "Which statement best distinguishes an additive from a synergistic interaction?", "options": {"A": "Additive equals the expected sum of effects; synergistic is greater than expected from additivity", "B": "They are identical terms", "C": "Additive means no effect; synergistic means exactly the same effect", "D": "Additive applies only to photons; synergistic only to neutrons"}, "correct": "A", "explanations": {"A": "Correct. Synergy indicates supra-additive interaction, while additivity matches the expected combined effect.", "B": "Incorrect. They describe different interaction magnitudes.", "C": "Incorrect. Additive combinations do produce an effect.", "D": "Incorrect. The distinction is biological/pharmacological, not limited to radiation types."}, "source": "IAEA Handbook, Sec. 3.14"}, {"id": 110, "section": "12. Advanced Integrated Topics", "stem": "Which statement best integrates physical dose and biological response?", "options": {"A": "One gray always causes exactly the same effect in every tissue and organism", "B": "Biological response depends only on photon count", "C": "Dose timing never matters", "D": "Equal physical doses can produce different effects depending on radiation quality, dose rate, fractionation, oxygenation, tissue, and endpoint"}, "correct": "D", "explanations": {"A": "Incorrect. Equal absorbed dose does not imply equal biological effect.", "B": "Incorrect. Energy deposition and biological context matter, not only particle count.", "C": "Incorrect. Dose rate, interfraction interval, and overall treatment time are major determinants.", "D": "Correct. Radiobiological effect is modified by LET/RBE, repair, proliferation, oxygen, tissue organization, and the chosen endpoint."}, "source": "Synthesis of both PDFs"}];
function loadState(){try{return JSON.parse(localStorage.getItem('radbio_exam_state')||'null')}catch(e){return null}}
let state=loadState()||{index:0,answers:{},checked:{}};
const $=id=>document.getElementById(id);
const sections=[...new Set(QUESTIONS.map(q=>q.section))];
sections.forEach((s,i)=>{const o=document.createElement('option');o.value=s;o.textContent=`${i+1}. ${s.replace(/^\d+\.\s*/, '')}`; $('sectionSelect').appendChild(o);});
function save(){try{localStorage.setItem('radbio_exam_state',JSON.stringify(state));}catch(e){}}
function render(){
 const q=QUESTIONS[state.index]; $('section').textContent=q.section; $('qnum').textContent=`Question ${q.id} of ${QUESTIONS.length}`; $('stem').textContent=q.stem; $('sectionSelect').value=q.section;
 $('progressLabel').textContent=`Question ${q.id} of ${QUESTIONS.length} • ${Object.keys(state.answers).length} answered`;
 $('progressBar').style.width=`${(q.id/QUESTIONS.length)*100}%`;
 $('options').innerHTML='';
 for(const [k,v] of Object.entries(q.options)){
  const lab=document.createElement('label'); lab.className='option'; lab.dataset.key=k;
  const inp=document.createElement('input'); inp.type='radio'; inp.name='answer'; inp.value=k; inp.checked=state.answers[q.id]===k; inp.disabled=!!state.checked[q.id];
  inp.addEventListener('change',()=>{state.answers[q.id]=k;save();});
  lab.appendChild(inp); lab.appendChild(document.createTextNode(`${k}. ${v}`)); $('options').appendChild(lab);
 }
 $('feedback').hidden=true; $('feedback').innerHTML=''; $('check').disabled=!!state.checked[q.id]; $('check').textContent=state.checked[q.id]?'Answer Checked':'Check Answer';
 if(state.checked[q.id]) showFeedback(q);
 $('prev').disabled=$('prevTop').disabled=state.index===0; $('next').disabled=$('nextTop').disabled=state.index===QUESTIONS.length-1;
 renderGrid();
}
function showFeedback(q){
 const chosen=state.answers[q.id]; const ok=chosen===q.correct;
 document.querySelectorAll('.option').forEach(l=>{if(l.dataset.key===q.correct)l.classList.add('correct');else if(l.dataset.key===chosen)l.classList.add('incorrect');});
 let out=`<div class="result ${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}. The correct answer is ${q.correct}.</div>`;
 for(const k of ['A','B','C','D']) out+=`<div class="exp ${k===q.correct?'good':(k===chosen?'bad':'')}"><strong>${k}.</strong> ${q.explanations[k]}</div>`;
 out+=`<div class="source"><strong>Source basis:</strong> ${q.source}</div>`; $('feedback').innerHTML=out; $('feedback').hidden=false;
}
$('check').onclick=()=>{const q=QUESTIONS[state.index]; if(!state.answers[q.id]){alert('Choose an answer first.');return;} state.checked[q.id]=true;save();render();};
function go(delta){state.index=Math.max(0,Math.min(QUESTIONS.length-1,state.index+delta));save();render();window.scrollTo({top:0,behavior:'smooth'});}
$('prev').onclick=$('prevTop').onclick=()=>go(-1); $('next').onclick=$('nextTop').onclick=()=>go(1);
$('sectionSelect').onchange=e=>{state.index=QUESTIONS.findIndex(q=>q.section===e.target.value);save();render();};
$('reset').onclick=()=>{if(confirm('Reset all answers and progress?')){state={index:0,answers:{},checked:{}};save();$('summary').style.display='none';render();}};
function renderGrid(){const g=$('grid');g.innerHTML='';QUESTIONS.forEach((q,i)=>{const b=document.createElement('button');b.className='jump';b.textContent=q.id;if(state.checked[q.id])b.classList.add(state.answers[q.id]===q.correct?'done':'wrong');b.onclick=()=>{state.index=i;save();render();};g.appendChild(b);});}
$('submitAll').onclick=()=>{let correct=0,answered=0;QUESTIONS.forEach(q=>{if(state.answers[q.id])answered++;if(state.answers[q.id]===q.correct)correct++;}); const pct=Math.round(correct/QUESTIONS.length*100); $('scoreBig').textContent=`${correct} / ${QUESTIONS.length} (${pct}%)`; $('scoreText').textContent=`You answered ${answered} questions. Unanswered questions count as incorrect in this score. Use the map to review each item.`; $('summary').style.display='block';renderGrid();$('summary').scrollIntoView({behavior:'smooth'});};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
render();
</script>
</body></html>
