<style>
:root { --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#5a667a; --line:#dce3ee; --good:#0b7a45; --bad:#b3261e; --accent:#2457c5; --soft:#eef3ff; }
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:linear-gradient(135deg,#13294b,#2457c5);color:white;padding:28px 20px}
.header-inner{max-width:980px;margin:auto} h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.7rem)}
.subtitle{opacity:.9;max-width:760px} main{max-width:980px;margin:22px auto;padding:0 16px 60px}
.toolbar,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 22px rgba(20,40,80,.06)}
.toolbar{padding:14px;position:sticky;top:8px;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select{font:inherit} button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}
.primary{background:var(--accent);color:#fff} .secondary{background:var(--soft);color:#173f95} .danger{background:#fdecea;color:var(--bad)}
.progress-wrap{flex:1;min-width:180px} .progress-label{font-size:.88rem;color:var(--muted);margin-bottom:4px}
.progress{height:9px;background:#e7edf7;border-radius:999px;overflow:hidden} .progress>div{height:100%;background:var(--accent);width:0}
.card{margin-top:18px;padding:22px} .section{color:var(--accent);font-weight:750;font-size:.9rem}
.qnum{color:var(--muted);font-size:.92rem} .stem{font-size:1.18rem;font-weight:720;margin:9px 0 15px}
.option{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:9px 0;cursor:pointer;background:white}
.option:hover{border-color:#9bb4e9;background:#fbfcff} .option input{margin-right:10px;transform:scale(1.15)}
.option.correct{border-color:#83c9a7;background:#ecf9f2} .option.incorrect{border-color:#efaaa6;background:#fff0ef}
.feedback{margin-top:16px;border-top:1px solid var(--line);padding-top:15px} .result.good{color:var(--good);font-weight:800} .result.bad{color:var(--bad);font-weight:800}
.exp{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:#fafbfd;border-radius:6px} .exp strong{display:inline-block;min-width:26px}
.exp.good{border-left-color:var(--good);background:#f0faf5} .exp.bad{border-left-color:var(--bad);background:#fff5f4}
.source{font-size:.86rem;color:var(--muted);margin-top:12px} .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.summary{display:none} .score-big{font-size:2.1rem;font-weight:850;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px;margin-top:12px} .jump{padding:8px 0;background:#eef2f8;color:#344056}
.jump.done{background:#eaf7f0;color:var(--good)} .jump.wrong{background:#fdecea;color:var(--bad)}
.note{font-size:.9rem;color:var(--muted)}
@media print{header,.toolbar,.nav,.jump-grid-title{display:none!important} body{background:white} main{max-width:none;margin:0;padding:0} .card{box-shadow:none;border:0;page-break-inside:avoid}}
</style>

<body>
<header><div class="header-inner"><h1>Comprehensive Radiation Biology MCQ Exam</h1><div class="subtitle">110 questions based on the two uploaded PDFs. Choose an answer, then check it to see why every option is correct or incorrect. Your progress is saved in this browser.</div></div></header>

<script>
const QUESTIONS=[{"id": 1, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Which statement best defines radiation biology?", "options": {"A": "The study of how radiation is generated inside an X-ray tube", "B": "The measurement of radiation only in air", "C": "The study of non-ionizing radiation exclusively", "D": "The study of events in living organisms following absorption of energy from ionizing radiation"}, "correct": "D", "explanations": {"A": "Incorrect. X-ray production is part of radiation physics, not the full definition of radiation biology.", "B": "Incorrect. Measuring radiation in air is dosimetry and does not address biological responses.", "C": "Incorrect. The PDFs focus on biological effects of ionizing radiation, not exclusively non-ionizing radiation.", "D": "Correct. Radiation biology follows the sequence of molecular, cellular, tissue, organ, and whole-body events after ionizing energy is absorbed."}, "source": "Biological Effects slides, pp. 4-5; IAEA Handbook, Sec. 2.1"}, {"id": 2, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Which sequence best represents the progression by which radiation injury may develop?", "options": {"A": "Organs → tissues → cells → molecules → atoms", "B": "Atoms → molecules → cells → tissues → organs → whole body", "C": "Cells → atoms → organs → molecules → tissues", "D": "Whole body → organs → radiation → atoms"}, "correct": "B", "explanations": {"A": "Incorrect. This reverses the usual progression from microscopic ionization to larger-scale biological effects.", "B": "Correct. Ionization begins at the atomic or molecular level and may propagate to cells, tissues, organs, and the whole body.", "C": "Incorrect. The order is biologically inconsistent.", "D": "Incorrect. Radiation exposure initiates the sequence; the whole body is not the starting level."}, "source": "Biological Effects slides, p. 5"}, {"id": 3, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "The absorbed dose is defined as:", "options": {"A": "The number of photons crossing a surface", "B": "Charge produced per unit mass of air", "C": "Biological risk multiplied by tissue weighting factor", "D": "Energy imparted by ionizing radiation per unit mass of matter"}, "correct": "D", "explanations": {"A": "Incorrect. Photon fluence counts particles per area and does not directly state energy absorbed per mass.", "B": "Incorrect. This resembles the older exposure quantity in air, not absorbed dose.", "C": "Incorrect. Weighting factors are used for equivalent and effective dose, not absorbed dose itself.", "D": "Correct. Absorbed dose is energy deposited divided by mass."}, "source": "IAEA Handbook, Sec. 2.2.5"}, {"id": 4, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "One gray (Gy) is equal to:", "options": {"A": "1 decay per second", "B": "1 sievert per hour", "C": "1 coulomb per kilogram", "D": "1 joule per kilogram"}, "correct": "D", "explanations": {"A": "Incorrect. One decay per second is one becquerel (Bq).", "B": "Incorrect. Sievert is a weighted protection quantity, and per hour would be a dose rate.", "C": "Incorrect. Coulomb per kilogram is associated with exposure in air.", "D": "Correct. By definition, 1 Gy = 1 J/kg of absorbed energy."}, "source": "IAEA Handbook, Sec. 2.2.5"}, {"id": 5, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Which quantity includes a radiation weighting factor to account for radiation type and energy?", "options": {"A": "Absorbed dose", "B": "Equivalent dose", "C": "Activity", "D": "Half-value layer"}, "correct": "B", "explanations": {"A": "Incorrect. Absorbed dose is purely energy per unit mass.", "B": "Correct. Equivalent dose is obtained by weighting absorbed dose for radiation quality.", "C": "Incorrect. Activity is the rate of nuclear transformations, measured in becquerels.", "D": "Incorrect. Half-value layer describes attenuation through material."}, "source": "IAEA Handbook, Sec. 4.7.1"}, {"id": 6, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Effective dose differs from equivalent dose because effective dose additionally accounts for:", "options": {"A": "The physical half-life of the radionuclide only", "B": "Tissue or organ sensitivity to stochastic effects", "C": "The distance from the source only", "D": "The number of fractions in radiotherapy"}, "correct": "B", "explanations": {"A": "Incorrect. Physical half-life can affect dose delivery but is not the defining tissue weighting.", "B": "Correct. Effective dose weights organ equivalent doses using tissue weighting factors.", "C": "Incorrect. Distance affects exposure but is not the defining extra weighting in effective dose.", "D": "Incorrect. Fraction number affects biological effect but not the definition of effective dose."}, "source": "IAEA Handbook, Sec. 4.7.1"}, {"id": 7, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Which photon interaction becomes possible only when photon energy is at least 1.022 MeV?", "options": {"A": "Photoelectric absorption", "B": "Pair production", "C": "Coherent scattering", "D": "Compton scattering"}, "correct": "B", "explanations": {"A": "Incorrect. Photoelectric absorption has no 1.022 MeV threshold.", "B": "Correct. Pair production requires at least the combined rest-mass energy of an electron and positron.", "C": "Incorrect. Coherent scattering can occur at much lower energies and does not require creation of rest mass.", "D": "Incorrect. Compton scattering also has no 1.022 MeV threshold."}, "source": "IAEA Handbook, Sec. 2.2.2"}, {"id": 8, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "The probability of the photoelectric effect is most strongly favored by:", "options": {"A": "Low photon energy and high atomic number of the absorber", "B": "Photon energy above 10 MeV regardless of material", "C": "High photon energy and low atomic number", "D": "Only the electron density of the absorber"}, "correct": "A", "explanations": {"A": "Correct. Photoelectric absorption increases strongly with absorber atomic number and is favored at lower photon energies.", "B": "Incorrect. At high energies other interactions, including pair production, become more important.", "C": "Incorrect. Those conditions generally reduce the relative importance of the photoelectric effect.", "D": "Incorrect. Electron density is more closely related to Compton interaction probability."}, "source": "IAEA Handbook, Sec. 2.2.2"}, {"id": 9, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Compton scattering depends primarily on the absorber’s:", "options": {"A": "Chemical bonding state only", "B": "Electron density", "C": "Nuclear charge raised to a high power", "D": "Neutron number only"}, "correct": "B", "explanations": {"A": "Incorrect. Chemical bonding has little influence compared with electron density at diagnostic and therapeutic energies.", "B": "Correct. Compton interactions occur with relatively loosely bound electrons, so probability is related mainly to electron density.", "C": "Incorrect. Strong atomic-number dependence is characteristic of photoelectric absorption.", "D": "Incorrect. Neutron number is not the primary determinant of Compton scattering."}, "source": "IAEA Handbook, Sec. 2.2.2"}, {"id": 10, "section": "1. Foundations, Radiation Interactions, Dose and Dosimetry", "stem": "Which statement best describes an ionization chamber?", "options": {"A": "It estimates dose by measuring charge produced by ionization in a gas", "B": "It directly images DNA double-strand breaks", "C": "It measures only radioactive half-life", "D": "It stores energy in crystal traps and releases light when heated"}, "correct": "A", "explanations": {"A": "Correct. Ionization chambers collect ions produced in a gas volume and relate the charge to radiation dose.", "B": "Incorrect. DNA damage assays, not ion chambers, image molecular lesions.", "C": "Incorrect. Half-life is a nuclear property and is not the chamber’s primary measurement.", "D": "Incorrect. That describes thermoluminescent dosimetry (TLD)."}, "source": "IAEA Handbook, Sec. 2.2.6"}, {"id": 11, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Direct action occurs when ionizing radiation:", "options": {"A": "Ionizes water and the resulting radicals later attack DNA", "B": "Only heats the whole body", "C": "Causes damage exclusively through immune reactions", "D": "Deposits energy directly in a critical biological target such as DNA"}, "correct": "D", "explanations": {"A": "Incorrect. That is indirect action through water radiolysis.", "B": "Incorrect. Ionizing radiation damage is not explained simply by bulk heating.", "C": "Incorrect. Immune responses may modify injury but do not define direct action.", "D": "Correct. In direct action, the radiation track itself ionizes or excites the target molecule."}, "source": "Biological Effects slides, pp. 11-12; IAEA Handbook, Sec. 2.2.7"}, {"id": 12, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Indirect action is especially important in cells because:", "options": {"A": "Indirect action occurs only after cell division", "B": "Cells contain large amounts of water that can form reactive radicals", "C": "Only neutrons can enter cells", "D": "DNA cannot be ionized directly"}, "correct": "B", "explanations": {"A": "Incorrect. Radical chemistry begins extremely rapidly after energy deposition, not only after division.", "B": "Correct. Radiolysis of cellular water produces reactive species that can damage DNA, enzymes, and membranes.", "C": "Incorrect. Many forms of radiation can interact with cells.", "D": "Incorrect. DNA can also be damaged by direct ionization."}, "source": "Biological Effects slides, pp. 13-14; IAEA Handbook, Sec. 2.2.7"}, {"id": 13, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Which reactive species is commonly emphasized as a major product of water radiolysis that damages biomolecules?", "options": {"A": "Sodium chloride crystal", "B": "Hemoglobin", "C": "Hydroxyl radical (•OH)", "D": "Stable molecular nitrogen only"}, "correct": "C", "explanations": {"A": "Incorrect. Sodium chloride is not a free radical product of radiolysis.", "B": "Incorrect. Hemoglobin is a protein, not a reactive radical generated from water.", "C": "Correct. The hydroxyl radical is highly reactive and can attack DNA and other macromolecules near where it is formed.", "D": "Incorrect. Nitrogen gas is not the principal damaging radical from water radiolysis."}, "source": "IAEA Handbook, Sec. 2.2.7"}, {"id": 14, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Oxygen enhances radiation damage mainly because it:", "options": {"A": "Converts high-LET radiation into low-LET radiation", "B": "Makes cells enter the radioresistant S phase", "C": "Prevents all ionizations from occurring", "D": "Chemically fixes radical-induced damage, making it less reversible"}, "correct": "D", "explanations": {"A": "Incorrect. LET is a property of track energy deposition and is not converted by oxygen.", "B": "Incorrect. Oxygen enhancement is chemical and not primarily caused by forcing cells into S phase.", "C": "Incorrect. Oxygen does not prevent ionization.", "D": "Correct. Oxygen reacts with radiation-induced radicals and stabilizes damage, reducing chemical restitution."}, "source": "IAEA Handbook, Secs. 2.2.7 and 2.3.12"}, {"id": 15, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "A radical scavenger would be expected to:", "options": {"A": "Increase indirect radiation damage by creating more radicals", "B": "Increase photon energy", "C": "Compete with critical targets for reactive species and reduce indirect damage", "D": "Eliminate direct action completely"}, "correct": "C", "explanations": {"A": "Incorrect. Scavengers remove or neutralize radicals rather than create more damaging species.", "B": "Incorrect. Chemical scavengers do not change the incident photon energy.", "C": "Correct. By reacting with radicals, scavengers reduce the chance that radicals will attack critical cellular targets.", "D": "Incorrect. They can reduce indirect action but cannot prevent direct energy deposition in DNA."}, "source": "IAEA Handbook, Sec. 2.2.7"}, {"id": 16, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Linear energy transfer (LET) is best described as:", "options": {"A": "Dose multiplied by tissue weighting factor", "B": "Energy deposited per unit track length", "C": "Total energy emitted per radioactive decay", "D": "Number of cells killed per fraction"}, "correct": "B", "explanations": {"A": "Incorrect. That relates to protection quantities rather than track energy density.", "B": "Correct. LET describes the average energy transferred to the medium as radiation travels a unit distance.", "C": "Incorrect. That is not a track-structure definition.", "D": "Incorrect. Cell killing is a biological endpoint, not the physical definition of LET."}, "source": "Biological Effects slides, p. 15; IAEA Handbook, Sec. 2.2.4"}, {"id": 17, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Compared with low-LET radiation, high-LET radiation generally produces:", "options": {"A": "No DNA damage", "B": "Only indirect effects through water", "C": "Densely spaced ionizations and more complex clustered damage", "D": "More widely separated ionizations and easier repair"}, "correct": "C", "explanations": {"A": "Incorrect. High-LET radiation is highly effective at damaging DNA.", "B": "Incorrect. High-LET radiation has a larger direct-action component, not only indirect action.", "C": "Correct. High-LET tracks create dense clusters of ionization, often causing complex, difficult-to-repair lesions.", "D": "Incorrect. Widely spaced ionizations are more characteristic of low-LET tracks."}, "source": "Biological Effects slides, p. 16; IAEA Handbook, Sec. 2.2.4"}, {"id": 18, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Relative biological effectiveness (RBE) is calculated as:", "options": {"A": "Dose of reference radiation ÷ dose of test radiation for the same effect", "B": "Dose of test radiation ÷ dose of reference radiation for the same effect", "C": "Absorbed dose × exposure time", "D": "LET ÷ photon energy"}, "correct": "A", "explanations": {"A": "Correct. RBE compares the reference dose with the test-radiation dose needed to produce the same biological endpoint.", "B": "Incorrect. This is the inverse of the usual RBE definition.", "C": "Incorrect. Dose already incorporates energy per mass and is not defined as dose times time.", "D": "Incorrect. LET influences RBE but is not divided by photon energy to define it."}, "source": "Biological Effects slides, p. 15; IAEA Handbook, Sec. 2.3.8"}, {"id": 19, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "If 6 Gy of reference X-rays and 2 Gy of a test radiation produce the same endpoint, the RBE of the test radiation is:", "options": {"A": "2", "B": "0.33", "C": "3", "D": "12"}, "correct": "C", "explanations": {"A": "Incorrect. The ratio is not 6 minus 2 or 6 divided by 3.", "B": "Incorrect. This results from reversing the RBE ratio.", "C": "Correct. RBE = 6 Gy / 2 Gy = 3.", "D": "Incorrect. Multiplying the two doses does not calculate RBE."}, "source": "IAEA Handbook, Sec. 2.3.8"}, {"id": 20, "section": "2. Mechanisms of Damage, LET, RBE and Oxygen Effects", "stem": "Why can RBE decrease at extremely high LET values?", "options": {"A": "Because oxygen becomes more effective", "B": "Because no ionizations occur", "C": "Because the radiation becomes non-ionizing", "D": "Because of overkill: more energy is deposited than is needed to inactivate the target"}, "correct": "D", "explanations": {"A": "Incorrect. Oxygen enhancement generally becomes less important as LET increases.", "B": "Incorrect. Very high-LET radiation produces abundant ionization.", "C": "Incorrect. High-LET radiation remains ionizing.", "D": "Correct. Once a target is lethally damaged, additional nearby ionizations are biologically wasted, reducing efficiency per unit dose."}, "source": "IAEA Handbook, Sec. 2.3.8"}, {"id": 21, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Why is DNA considered a primary critical target for radiation injury?", "options": {"A": "Because unrepaired or misrepaired DNA damage can alter reproduction, survival, and genetic integrity", "B": "Because DNA is located outside the cell", "C": "Because DNA is the most abundant molecule in the cell", "D": "Because radiation cannot damage proteins or membranes"}, "correct": "A", "explanations": {"A": "Correct. Damage to DNA can cause reproductive death, mutation, chromosome aberration, or carcinogenic transformation.", "B": "Incorrect. Nuclear DNA is located inside the cell nucleus.", "C": "Incorrect. Water and proteins are more abundant, but DNA is critical because of its information and reproductive functions.", "D": "Incorrect. Radiation can also damage proteins, enzymes, membranes, and mitochondria."}, "source": "Biological Effects slides, pp. 7 and 11"}, {"id": 22, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Which lesion is generally more difficult for a cell to repair correctly?", "options": {"A": "A double-strand break involving both DNA backbones", "B": "A normal replication fork", "C": "A single-strand break with the opposite strand intact", "D": "Temporary hydrogen bonding between normal bases"}, "correct": "A", "explanations": {"A": "Correct. Double-strand breaks can lead to loss of continuity, chromosome rearrangement, or lethal misrepair.", "B": "Incorrect. A normal replication fork is a physiological structure.", "C": "Incorrect. A single-strand break often retains the opposite strand as a template.", "D": "Incorrect. Normal hydrogen bonding is part of DNA structure, not radiation injury."}, "source": "IAEA Handbook, Sec. 2.3.1"}, {"id": 23, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Clustered DNA damage refers to:", "options": {"A": "Damage found only in mitochondrial DNA", "B": "Multiple lesions occurring close together within one or two helical turns", "C": "A single isolated base lesion with no nearby damage", "D": "Damage distributed evenly among all cells in the body"}, "correct": "B", "explanations": {"A": "Incorrect. Clustered lesions can occur in nuclear or mitochondrial DNA.", "B": "Correct. Dense ionization can create combinations of strand breaks and base damage in a small region, complicating repair.", "C": "Incorrect. Clustered damage contains several nearby lesions.", "D": "Incorrect. The term describes microscopic lesion spacing, not whole-body distribution."}, "source": "IAEA Handbook, Sec. 3.5"}, {"id": 24, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Base excision repair is most directly suited to correcting:", "options": {"A": "Small chemically altered bases and abasic sites", "B": "Damage to the cell membrane only", "C": "Entire missing chromosomes", "D": "All double-strand breaks by copying a homologous chromosome"}, "correct": "A", "explanations": {"A": "Correct. DNA glycosylases recognize altered bases, initiating removal and replacement of a short damaged segment.", "B": "Incorrect. Base excision repair acts on DNA, not membranes.", "C": "Incorrect. Loss of an entire chromosome cannot be restored by base excision repair.", "D": "Incorrect. Homologous recombination is a major pathway for double-strand breaks."}, "source": "Biological Effects slides, pp. 60-61; IAEA Handbook, Sec. 2.3.2"}, {"id": 25, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Homologous recombination repair is favored when:", "options": {"A": "The lesion is an isolated damaged base", "B": "The cell has no DNA template and is in G0 only", "C": "A homologous DNA template such as a sister chromatid is available", "D": "Only membrane lipids are damaged"}, "correct": "C", "explanations": {"A": "Incorrect. Small base lesions are usually handled by base excision or related pathways.", "B": "Incorrect. Lack of a template makes HR unavailable.", "C": "Correct. HR uses an intact homologous sequence, especially the sister chromatid in S/G2, to achieve relatively accurate repair.", "D": "Incorrect. HR repairs DNA double-strand breaks, not lipid damage."}, "source": "IAEA Handbook, Sec. 3.5"}, {"id": 26, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Non-homologous end joining (NHEJ) repairs DNA double-strand breaks by:", "options": {"A": "Replacing an entire chromosome from RNA", "B": "Directly rejoining DNA ends without requiring a homologous template", "C": "Preventing the break from being detected", "D": "Removing only a single altered base"}, "correct": "B", "explanations": {"A": "Incorrect. RNA does not replace a whole chromosome in this process.", "B": "Correct. NHEJ processes and ligates broken ends and can function throughout much of the cell cycle.", "C": "Incorrect. Damage recognition is necessary for repair activation.", "D": "Incorrect. That is closer to base excision repair."}, "source": "IAEA Handbook, Sec. 3.5"}, {"id": 27, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "ATM is important in radiation response because it:", "options": {"A": "Is the main structural protein of the cell membrane", "B": "Acts as a damage-sensing and signalling kinase, especially after double-strand breaks", "C": "Eliminates the need for cell-cycle checkpoints", "D": "Produces X-rays in the nucleus"}, "correct": "B", "explanations": {"A": "Incorrect. ATM is not a membrane structural protein.", "B": "Correct. ATM activation coordinates checkpoint signalling and repair responses after DNA double-strand breaks.", "C": "Incorrect. ATM helps activate checkpoints rather than eliminating them.", "D": "Incorrect. Cells do not produce X-rays through ATM."}, "source": "IAEA Handbook, Secs. 2.3.3 and 3.5"}, {"id": 28, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "A major function of p53 after radiation-induced DNA damage is to:", "options": {"A": "Increase radioactive decay", "B": "Prevent all mutations with certainty", "C": "Convert alpha particles to photons", "D": "Promote checkpoint arrest, repair, senescence, or apoptosis depending on damage"}, "correct": "D", "explanations": {"A": "Incorrect. p53 does not alter nuclear decay rates.", "B": "Incorrect. p53 reduces propagation of damage but cannot guarantee perfect repair.", "C": "Incorrect. It does not transform radiation type.", "D": "Correct. p53 regulates transcriptional programs that can halt the cell cycle or direct damaged cells toward senescence or apoptosis."}, "source": "IAEA Handbook, Secs. 2.3.3 and 3.4"}, {"id": 29, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Which chromosome aberration is classically useful for biological dosimetry shortly after an acute exposure?", "options": {"A": "Dicentric chromosome", "B": "A stable inherited eye color allele", "C": "A mitochondrial crista", "D": "Normal homologous pair"}, "correct": "A", "explanations": {"A": "Correct. Dicentric chromosomes in peripheral blood lymphocytes are a well-established indicator of recent radiation exposure.", "B": "Incorrect. A normal inherited allele is not a radiation biodosimeter.", "C": "Incorrect. A mitochondrial structure is not a chromosome aberration.", "D": "Incorrect. A normal chromosome pair does not indicate dose."}, "source": "IAEA Handbook, Sec. 2.3.4 and practicals; Biological Effects slides, pp. 47-51"}, {"id": 30, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "A micronucleus most often contains:", "options": {"A": "An intact second cell nucleus containing all chromosomes", "B": "A whole chromosome or chromosome fragment excluded from the main daughter nuclei", "C": "Only cell membrane lipids", "D": "A collection of free radicals"}, "correct": "B", "explanations": {"A": "Incorrect. A micronucleus contains only a small portion of genetic material.", "B": "Correct. Lagging acentric fragments or whole chromosomes can form small extranuclear bodies after division.", "C": "Incorrect. Micronuclei contain chromosomal material, not membrane lipids.", "D": "Incorrect. Free radicals are transient chemical species, not micronuclear contents."}, "source": "IAEA Handbook, practicals/tutorials"}, {"id": 31, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "Why are stable translocations more useful than dicentrics for estimating remote past exposure?", "options": {"A": "They disappear immediately after irradiation", "B": "They occur only in skin cells", "C": "They can persist through many cell divisions", "D": "They are not chromosome aberrations"}, "correct": "C", "explanations": {"A": "Incorrect. Their persistence is the reason they are useful for retrospective assessment.", "B": "Incorrect. Translocations can be measured in blood lymphocytes.", "C": "Correct. Balanced translocations can be carried by viable lymphocyte clones for long periods.", "D": "Incorrect. A translocation is a structural chromosome aberration."}, "source": "IAEA Handbook, Sec. 4.2.1"}, {"id": 32, "section": "3. DNA Damage, Repair, Signalling and Chromosome Effects", "stem": "A faulty DNA repair event can lead to which outcome?", "options": {"A": "Guaranteed complete recovery", "B": "Correct cell division only", "C": "Mutation, malignant transformation, or delayed reproductive death", "D": "Conversion of ionizing radiation into sound"}, "correct": "C", "explanations": {"A": "Incorrect. Faulty repair cannot guarantee recovery.", "B": "Incorrect. Correct division follows effective repair, not faulty repair.", "C": "Correct. Misrepair can preserve viability while introducing mutations or chromosome changes, or it can lead to later cell death.", "D": "Incorrect. DNA repair does not convert radiation into sound."}, "source": "Biological Effects slides, pp. 6-8 and 58-64"}, {"id": 33, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "The radiobiological definition of cell death is primarily:", "options": {"A": "Any change in cell shape", "B": "Immediate loss of membrane integrity only", "C": "Temporary slowing of metabolism", "D": "Loss of the ability to undergo sustained reproductive division"}, "correct": "D", "explanations": {"A": "Incorrect. Shape change alone is not sufficient to define radiobiological death.", "B": "Incorrect. A cell may remain metabolically intact yet be reproductively dead.", "C": "Incorrect. Temporary slowing can be reversible and does not necessarily mean death.", "D": "Correct. Clonogenic or reproductive death is the key radiobiological endpoint."}, "source": "IAEA Handbook, Secs. 2.3.5 and 3.7"}, {"id": 34, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "A clonogenic assay measures a cell’s ability to:", "options": {"A": "Produce ionizing radiation", "B": "Take up a vital dye at one moment only", "C": "Repair membrane lipids exclusively", "D": "Form a colony through repeated divisions"}, "correct": "D", "explanations": {"A": "Incorrect. Cells do not produce the therapeutic radiation in this assay.", "B": "Incorrect. Short-term viability may count cells that are alive but reproductively dead.", "C": "Incorrect. Colony formation integrates overall reproductive survival, not only membrane repair.", "D": "Correct. A surviving cell must retain long-term reproductive capacity and form a colony."}, "source": "IAEA Handbook, Secs. 2.3.6 and 3.8"}, {"id": 35, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "The shoulder of a low-LET cell survival curve mainly reflects:", "options": {"A": "Pair production in the cell nucleus", "B": "Absence of any radiation damage", "C": "Capacity to accumulate and repair sublethal damage", "D": "Only stochastic cancer risk"}, "correct": "C", "explanations": {"A": "Incorrect. Pair production is a photon interaction, not the biological interpretation of the shoulder.", "B": "Incorrect. Damage occurs even within the shoulder region.", "C": "Correct. The shoulder indicates that multiple lesions can be repaired before they combine into lethal damage.", "D": "Incorrect. Survival curves measure cell killing, not only population cancer risk."}, "source": "IAEA Handbook, Secs. 2.3.6 and 3.12.1"}, {"id": 36, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "In the linear-quadratic model SF = exp[-(αD + βD²)], the αD component represents:", "options": {"A": "Only repair between fractions", "B": "Tissue weighting for effective dose", "C": "Damage proportional to dose from single-track events", "D": "Dose squared from interaction of two sublesions"}, "correct": "C", "explanations": {"A": "Incorrect. Repair modifies observed survival but is not the definition of αD.", "B": "Incorrect. Tissue weighting is unrelated to the cell-survival equation.", "C": "Correct. The linear component is proportional to dose and is commonly interpreted as single-track lethal events.", "D": "Incorrect. That describes the quadratic βD² component."}, "source": "IAEA Handbook, Sec. 3.12.7"}, {"id": 37, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "In the linear-quadratic model, the βD² component is commonly associated with:", "options": {"A": "A dose-independent background effect", "B": "Only direct action by alpha particles", "C": "Interaction of two radiation-induced sublesions", "D": "Radioactive activity in becquerels"}, "correct": "C", "explanations": {"A": "Incorrect. βD² is strongly dose dependent.", "B": "Incorrect. The LQ model is used broadly and is not limited to alpha-particle direct action.", "C": "Correct. The quadratic term represents damage that increases with the square of dose, often modeled as interaction of two sublesions.", "D": "Incorrect. Activity is not part of the LQ survival equation."}, "source": "IAEA Handbook, Sec. 3.12.7"}, {"id": 38, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Giving a dose in two fractions separated by sufficient time often increases survival because of:", "options": {"A": "An increase in LET", "B": "A larger total absorbed dose", "C": "Sublethal damage repair between fractions", "D": "Removal of all oxygen from the tissue"}, "correct": "C", "explanations": {"A": "Incorrect. Fractionation does not inherently increase LET.", "B": "Incorrect. The comparison assumes the same total dose.", "C": "Correct. Cells can repair part of the damage during the interval, increasing survival compared with the same dose given at once.", "D": "Incorrect. Oxygen removal would tend to reduce low-LET damage but is not the general explanation for split-dose recovery."}, "source": "IAEA Handbook, Sec. 2.3.9"}, {"id": 39, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Potentially lethal damage repair (PLDR) is most clearly demonstrated when:", "options": {"A": "Post-irradiation conditions are altered to delay cell division and allow repair", "B": "The cell is forced to divide immediately", "C": "The radiation is changed from photons to sound", "D": "Only the absorbed dose unit is changed"}, "correct": "A", "explanations": {"A": "Correct. Holding cells under non-proliferative conditions after irradiation can allow repair of damage that would otherwise become lethal.", "B": "Incorrect. Immediate division can reduce the opportunity for PLDR.", "C": "Incorrect. This is not a radiation-repair mechanism.", "D": "Incorrect. Changing the unit label does not change biology."}, "source": "IAEA Handbook, Sec. 2.3.9"}, {"id": 40, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Which cell-cycle phase is generally among the most radiosensitive?", "options": {"A": "Late S phase", "B": "Quiescent G0 in every tissue without exception", "C": "No phase differs in sensitivity", "D": "M phase"}, "correct": "D", "explanations": {"A": "Incorrect. Late S phase is often relatively radioresistant because of active repair and replicated DNA.", "B": "Incorrect. G0 sensitivity varies, and it is not universally the most sensitive state.", "C": "Incorrect. Radiation sensitivity changes across the cell cycle.", "D": "Correct. M and G2 phases are generally among the most radiosensitive."}, "source": "IAEA Handbook, Sec. 2.3.7"}, {"id": 41, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Which phase is commonly considered relatively radioresistant?", "options": {"A": "Late S phase", "B": "The G2/M transition", "C": "M phase", "D": "G2 phase"}, "correct": "A", "explanations": {"A": "Correct. Late S phase often shows greater resistance, partly because of efficient homologous repair and replicated DNA.", "B": "Incorrect. The G2/M region is usually sensitive.", "C": "Incorrect. M phase is usually highly radiosensitive.", "D": "Incorrect. G2 is generally sensitive."}, "source": "IAEA Handbook, Sec. 2.3.7"}, {"id": 42, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Radiation-induced cell-cycle checkpoints primarily allow a cell to:", "options": {"A": "Increase the physical energy of radiation", "B": "Convert somatic cells into germ cells", "C": "Pause progression so damage can be assessed and repaired", "D": "Avoid all future mutations automatically"}, "correct": "C", "explanations": {"A": "Incorrect. Cell-cycle control does not alter incident radiation energy.", "B": "Incorrect. They do not change cell lineage in this way.", "C": "Correct. Checkpoints delay transition through the cycle to coordinate repair or trigger death/senescence.", "D": "Incorrect. Checkpoints reduce risk but cannot ensure perfect repair."}, "source": "IAEA Handbook, Secs. 2.3.3 and 3.4"}, {"id": 43, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "Mitotic catastrophe is best described as:", "options": {"A": "Immediate thermal coagulation of all proteins", "B": "A stable adaptive mutation with no loss of survival", "C": "A normal programmed developmental process only", "D": "Death associated with abnormal or failed mitosis after severe chromosome damage"}, "correct": "D", "explanations": {"A": "Incorrect. It is not defined as bulk thermal injury.", "B": "Incorrect. Mitotic catastrophe typically results in loss of reproductive survival.", "C": "Incorrect. Apoptosis can be developmental; mitotic catastrophe is tied to defective mitosis.", "D": "Correct. Cells with major chromosome or spindle damage may enter aberrant mitosis and die during or after division."}, "source": "IAEA Handbook, Sec. 3.7"}, {"id": 44, "section": "4. Cell Death, Survival Curves, Cell Cycle and Non-targeted Effects", "stem": "A radiation bystander effect occurs when:", "options": {"A": "Only directly traversed cells respond", "B": "Non-irradiated neighboring cells show responses due to signals from irradiated cells", "C": "A patient stands near an X-ray machine that is switched off", "D": "Radiation is completely blocked by shielding"}, "correct": "B", "explanations": {"A": "Incorrect. Bystander effects specifically extend beyond directly hit cells.", "B": "Correct. Intercellular signalling can produce DNA damage responses or altered survival in nearby unirradiated cells.", "C": "Incorrect. No exposure occurs from a switched-off source.", "D": "Incorrect. Complete shielding would prevent the initiating exposure."}, "source": "IAEA Handbook, Sec. 2.3.11"}, {"id": 45, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "A deterministic tissue reaction is characterized by:", "options": {"A": "Occurrence only after very low doses", "B": "A threshold dose, with severity generally increasing above the threshold", "C": "No threshold and dose-independent severity", "D": "Occurrence only in descendants"}, "correct": "B", "explanations": {"A": "Incorrect. They generally require moderate or high tissue doses.", "B": "Correct. Sufficient cell killing is required before a clinical tissue reaction appears, and severity rises with dose.", "C": "Incorrect. This describes aspects of stochastic effects rather than tissue reactions.", "D": "Incorrect. Deterministic effects are usually somatic in the exposed individual."}, "source": "Biological Effects slides, pp. 20-33; IAEA Handbook, Sec. 4.1"}, {"id": 46, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "For a stochastic effect such as radiation-induced cancer:", "options": {"A": "Probability increases with dose, while severity is not determined by dose", "B": "The effect can be identified clinically as radiation-specific", "C": "A clear tissue-reaction threshold must be crossed", "D": "Severity increases with dose in each affected person"}, "correct": "A", "explanations": {"A": "Correct. Stochastic risk is described by increasing occurrence probability with dose.", "B": "Incorrect. Radiation-induced tumors are generally indistinguishable from spontaneous tumors.", "C": "Incorrect. Standard radiation-protection models do not assume a deterministic threshold for cancer risk.", "D": "Incorrect. Dose primarily affects probability, not the severity of a cancer once it occurs."}, "source": "Biological Effects slides, pp. 45-46 and 102; IAEA Handbook, Sec. 4.1"}, {"id": 47, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Which is a somatic effect?", "options": {"A": "An inherited effect expressed only in descendants", "B": "A change in equipment calibration", "C": "A change in radiation source activity", "D": "An effect expressed in the exposed individual"}, "correct": "D", "explanations": {"A": "Incorrect. That is a hereditary or heritable effect.", "B": "Incorrect. Calibration is an instrumentation issue.", "C": "Incorrect. Source activity is a physical property, not a biological effect.", "D": "Correct. Somatic effects occur in the body cells and health of the irradiated person."}, "source": "Biological Effects slides, pp. 20 and 84"}, {"id": 48, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "According to the Bergonie and Tribondeau principle, cells tend to be more radiosensitive when they are:", "options": {"A": "Rapidly dividing, less differentiated, and expected to undergo many future divisions", "B": "Always in late S phase", "C": "Large but permanently non-dividing", "D": "Highly differentiated and rarely dividing"}, "correct": "A", "explanations": {"A": "Correct. High mitotic activity and low differentiation are classical predictors of radiosensitivity.", "B": "Incorrect. Late S is often relatively resistant.", "C": "Incorrect. Cell size alone is not the governing law.", "D": "Incorrect. Highly differentiated, slowly dividing cells are often less sensitive to reproductive death."}, "source": "Biological Effects slides, pp. 35-36"}, {"id": 49, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Why are growing children generally more radiosensitive than adults?", "options": {"A": "Their tissues contain no water", "B": "They receive only high-LET radiation", "C": "They have fewer dividing cells and shorter remaining lifespan", "D": "They have a higher proportion of proliferating cells and more time for late effects to develop"}, "correct": "D", "explanations": {"A": "Incorrect. Children’s tissues contain abundant water like other human tissues.", "B": "Incorrect. Radiation quality depends on the exposure, not age.", "C": "Incorrect. Children generally have more proliferating cells and a longer remaining lifespan.", "D": "Correct. Developing tissues and long future life expectancy increase sensitivity and the window for cancer expression."}, "source": "Biological Effects slides, p. 18"}, {"id": 50, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Which comparison between acute and chronic exposure is correct?", "options": {"A": "Chronic exposure permits no biological repair", "B": "Acute exposure always has a lower dose rate than chronic exposure", "C": "Acute exposure delivers dose over a short period; chronic exposure is prolonged or repeated", "D": "They are identical if measured in gray"}, "correct": "C", "explanations": {"A": "Incorrect. Protracted exposure often permits more repair and cell replacement.", "B": "Incorrect. Acute exposure commonly has a higher dose rate.", "C": "Correct. The terms primarily distinguish the time pattern of dose delivery.", "D": "Incorrect. Equal absorbed dose can have different biological effects depending on dose rate and time."}, "source": "Biological Effects slides, p. 39"}, {"id": 51, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Which is an example of an early deterministic effect?", "options": {"A": "A normal age-related cataract with no exposure", "B": "Skin erythema after a sufficiently high local dose", "C": "A hereditary mutation in a future descendant", "D": "A solid cancer appearing decades later"}, "correct": "B", "explanations": {"A": "Incorrect. Without exposure it is not a radiation effect.", "B": "Correct. Erythema can appear within days to weeks after threshold skin exposure.", "C": "Incorrect. Heritable effects are stochastic and expressed in descendants.", "D": "Incorrect. A late cancer is a stochastic effect."}, "source": "Biological Effects slides, pp. 24-31 and 40-41"}, {"id": 52, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Late deterministic tissue effects commonly involve:", "options": {"A": "No relationship to fraction size", "B": "Only immediately dividing blood cells", "C": "Fibrosis, atrophy, and microvascular injury", "D": "Only transient nausea during irradiation"}, "correct": "C", "explanations": {"A": "Incorrect. Late effects are often strongly dependent on dose per fraction.", "B": "Incorrect. Late injury can involve slowly proliferating structural tissues.", "C": "Correct. Chronic inflammation, vascular damage, ischemia, atrophy, and fibrosis are typical late pathways.", "D": "Incorrect. Nausea is generally an early or prodromal symptom."}, "source": "IAEA Handbook, Secs. 2.5.3 and 3.11.2"}, {"id": 53, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "In a population dose-response curve for a deterministic effect, variation in individual sensitivity causes:", "options": {"A": "The disappearance of the threshold concept", "B": "Every person to show the effect at exactly the same dose", "C": "The effect probability to decrease as dose rises", "D": "A gradual increase in the proportion affected across a dose range"}, "correct": "D", "explanations": {"A": "Incorrect. A threshold remains relevant even though it is distributed across a population.", "B": "Incorrect. Biological variability means thresholds differ among individuals.", "C": "Incorrect. The proportion affected generally increases with dose.", "D": "Correct. As dose increases, increasingly resistant members of the population cross their individual thresholds."}, "source": "Biological Effects slides, pp. 33-34"}, {"id": 54, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Which statement correctly distinguishes regeneration from repair in tissue healing?", "options": {"A": "Both terms mean immediate cell death", "B": "Regeneration replaces tissue with the original cell type; repair replaces it largely with connective tissue", "C": "Neither process occurs after radiation injury", "D": "Regeneration always produces fibrosis; repair restores normal architecture"}, "correct": "B", "explanations": {"A": "Incorrect. They describe healing responses, not death itself.", "B": "Correct. Regeneration restores original functional tissue, whereas repair often produces scar or connective tissue.", "C": "Incorrect. Both may occur after radiation injury depending on stem-cell survival and tissue organization.", "D": "Incorrect. The relationship is reversed."}, "source": "Biological Effects slides, p. 74"}, {"id": 55, "section": "5. Classification of Health Effects, Dose Response and Radiosensitivity", "stem": "Which factor would generally increase the biological effect of a fixed total low-LET dose?", "options": {"A": "Spreading it over a much longer time with complete repair", "B": "Delivering it at a higher dose rate with less time for repair", "C": "Adding radical scavengers", "D": "Reducing the irradiated volume"}, "correct": "B", "explanations": {"A": "Incorrect. Protraction often reduces effect by permitting repair and repopulation.", "B": "Correct. Less time for repair during delivery generally increases the effect of low-LET radiation.", "C": "Incorrect. Scavengers tend to reduce indirect damage.", "D": "Incorrect. A smaller volume generally reduces whole-organ consequences."}, "source": "Biological Effects slides, p. 17; IAEA Handbook, Sec. 2.3.9"}, {"id": 56, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "In radiobiology, tumour cure requires:", "options": {"A": "Inactivation of all clonogenic tumour cells capable of regrowth", "B": "Temporary shrinkage for one day", "C": "Killing only the most oxygenated cells", "D": "Elimination of every non-dividing stromal cell only"}, "correct": "A", "explanations": {"A": "Correct. Any surviving clonogenic tumour cell may repopulate and cause recurrence.", "B": "Incorrect. Temporary shrinkage does not prove eradication of clonogens.", "C": "Incorrect. Hypoxic clonogens must also be controlled.", "D": "Incorrect. Stromal effects may matter, but cure depends critically on eradicating tumour clonogens."}, "source": "IAEA Handbook, Secs. 2.4.2-2.4.3"}, {"id": 57, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "The Poisson model of tumour control is based on the probability that:", "options": {"A": "All normal tissue cells survive", "B": "Tumour volume remains unchanged", "C": "One photon reaches each tumour cell", "D": "Exactly zero clonogenic tumour cells survive treatment"}, "correct": "D", "explanations": {"A": "Incorrect. Normal tissue survival affects toxicity but is not the Poisson tumour-control condition.", "B": "Incorrect. Tumour volume can change and does not define zero surviving clonogens.", "C": "Incorrect. Photon count per cell is not the model’s endpoint.", "D": "Correct. Tumour control probability is linked to the chance that no clonogenic cells remain."}, "source": "IAEA Handbook, Sec. 2.4.3"}, {"id": 58, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "At the same dose and radiosensitivity, a larger tumour is generally harder to cure because it:", "options": {"A": "Contains more clonogenic cells that must all be inactivated", "B": "Always has perfect oxygenation", "C": "Contains no cycling cells", "D": "Receives a higher absorbed dose automatically"}, "correct": "A", "explanations": {"A": "Correct. More clonogens reduce the probability that all are eliminated by a given treatment.", "B": "Incorrect. Larger tumours often have more hypoxia, not perfect oxygenation.", "C": "Incorrect. Tumours commonly contain cycling and quiescent populations.", "D": "Incorrect. Dose is prescribed and does not automatically rise with tumour size."}, "source": "IAEA Handbook, Sec. 2.4.3"}, {"id": 59, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Hypoxic tumour cells are relatively resistant to low-LET radiation mainly because:", "options": {"A": "Hypoxia increases photon energy", "B": "They always remain in M phase", "C": "They contain no DNA", "D": "Oxygen is unavailable to fix radical damage"}, "correct": "D", "explanations": {"A": "Incorrect. Tissue oxygenation does not change photon energy.", "B": "Incorrect. Their resistance is not due to universal M-phase arrest.", "C": "Incorrect. Hypoxic tumour cells still contain DNA.", "D": "Correct. Without oxygen, some radical damage can be chemically restored before becoming permanent."}, "source": "IAEA Handbook, Sec. 2.4.6"}, {"id": 60, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Chronic diffusion-limited hypoxia is most likely found:", "options": {"A": "At cells located far from functioning blood vessels", "B": "In perfectly perfused tumour regions", "C": "Only inside red blood cells", "D": "Immediately after a brief vessel closure that quickly reopens"}, "correct": "A", "explanations": {"A": "Correct. Oxygen diffuses only a limited distance, leaving remote cells chronically hypoxic.", "B": "Incorrect. Good perfusion reduces chronic diffusion hypoxia.", "C": "Incorrect. The concept concerns tumour tissue relative to vessels.", "D": "Incorrect. Brief vessel closure produces acute or perfusion-limited hypoxia."}, "source": "IAEA Handbook, Sec. 3.10"}, {"id": 61, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Acute perfusion-limited hypoxia results mainly from:", "options": {"A": "A long diffusion distance from a stable vessel only", "B": "Permanent absence of all tumour vessels", "C": "High oxygen concentration in breathing air", "D": "Transient changes or closure in tumour blood flow"}, "correct": "D", "explanations": {"A": "Incorrect. That describes chronic diffusion-limited hypoxia.", "B": "Incorrect. Tumours generally contain abnormal but present vasculature.", "C": "Incorrect. Increased inspired oxygen is intended to improve, not create, hypoxia.", "D": "Correct. Fluctuating perfusion can temporarily deprive cells of oxygen."}, "source": "IAEA Handbook, Sec. 3.10"}, {"id": 62, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Reoxygenation during fractionated radiotherapy means:", "options": {"A": "Previously hypoxic surviving tumour cells become better oxygenated between fractions", "B": "Normal tissue becomes permanently anoxic", "C": "Cells are moved from M phase to S phase", "D": "The radiation source absorbs oxygen"}, "correct": "A", "explanations": {"A": "Correct. Tumour shrinkage and changes in perfusion or oxygen consumption can improve oxygenation of surviving cells.", "B": "Incorrect. Reoxygenation refers mainly to tumour cells and does not mean normal-tissue anoxia.", "C": "Incorrect. Cell-cycle redistribution is a separate R.", "D": "Incorrect. The source does not absorb tissue oxygen as the mechanism."}, "source": "IAEA Handbook, Sec. 3.12.4"}, {"id": 63, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Which approach can reduce hypoxia-associated radioresistance?", "options": {"A": "Correcting severe anemia or increasing oxygen availability", "B": "Giving radical scavengers to the tumour", "C": "Extending treatment indefinitely to encourage repopulation", "D": "Reducing LET in every case"}, "correct": "A", "explanations": {"A": "Correct. Improving oxygen delivery can increase radiosensitivity of hypoxic tumour cells.", "B": "Incorrect. Scavengers would tend to protect cells from indirect damage.", "C": "Incorrect. Excess prolongation can allow tumour repopulation.", "D": "Incorrect. High-LET radiation is less dependent on oxygen and can help overcome hypoxic resistance."}, "source": "IAEA Handbook, Sec. 3.10"}, {"id": 64, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "Tumour regrowth delay is especially useful as an endpoint for:", "options": {"A": "Measuring source activity in becquerels", "B": "Diagnosing chromosome translocations", "C": "Determining tissue weighting factors", "D": "Palliative response and experimental tumour-response assessment"}, "correct": "D", "explanations": {"A": "Incorrect. Activity is measured physically, not by tumour growth.", "B": "Incorrect. Cytogenetic assays diagnose chromosome aberrations.", "C": "Incorrect. Tissue weighting factors come from radiation-protection risk estimates.", "D": "Correct. Time taken for a treated tumour to regrow to a specified size quantifies growth delay."}, "source": "IAEA Handbook, Secs. 2.4.2 and 3.10"}, {"id": 65, "section": "6. Tumour Radiobiology, Growth, Hypoxia and Tumour Control", "stem": "TCD50 is the dose expected to:", "options": {"A": "Produce 50 radioactive decays per second", "B": "Cause 50% skin erythema in every person", "C": "Kill 50% of cells in a culture at time zero only", "D": "Control 50% of tumours under specified conditions"}, "correct": "D", "explanations": {"A": "Incorrect. Decays per second are becquerels.", "B": "Incorrect. That would be a normal-tissue endpoint, not TCD50.", "C": "Incorrect. Cell survival is not the same as tumour control in vivo.", "D": "Correct. TCD50 is a tumour-control dose for a 50% probability or group response."}, "source": "IAEA Handbook, Sec. 3.10"}, {"id": 66, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "Early-responding normal tissues usually have:", "options": {"A": "No stem-cell populations", "B": "No dependence on treatment time", "C": "Rapid cell turnover and injury expressed within days to weeks", "D": "Only fibrosis decades later"}, "correct": "C", "explanations": {"A": "Incorrect. Stem and progenitor cells are central to their response.", "B": "Incorrect. Overall time and repopulation can strongly influence early reactions.", "C": "Correct. Bone marrow, skin, and gastrointestinal mucosa have active cell renewal and can show early depletion-related injury.", "D": "Incorrect. Fibrosis is a classic late response."}, "source": "IAEA Handbook, Secs. 2.5.2 and 3.11.1"}, {"id": 67, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "Late-responding normal tissue injury is commonly associated with:", "options": {"A": "Microvascular damage, chronic inflammation, atrophy, and fibrosis", "B": "Complete independence from fraction size", "C": "No latency period", "D": "Only transient depletion of mature blood cells"}, "correct": "A", "explanations": {"A": "Correct. Late injury evolves through multicellular and vascular processes over months to years.", "B": "Incorrect. Late tissues are often highly sensitive to dose per fraction.", "C": "Incorrect. Late effects have substantial latency.", "D": "Incorrect. Blood-cell depletion is an early hematopoietic effect."}, "source": "IAEA Handbook, Secs. 2.5.3 and 3.11.2"}, {"id": 68, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "Radiation-induced hypoplasia in an early-responding tissue is mainly caused by:", "options": {"A": "Loss of proliferating stem or progenitor cells", "B": "Pair production in extracellular fluid", "C": "An increase in the number of functional cells", "D": "Excess collagen deposition only"}, "correct": "A", "explanations": {"A": "Correct. Cell killing reduces replacement of mature cells, leading to tissue depletion.", "B": "Incorrect. Pair production is not the biological mechanism of hypoplasia.", "C": "Incorrect. Hypoplasia means reduced cellularity.", "D": "Incorrect. Collagen deposition is more characteristic of late fibrosis."}, "source": "IAEA Handbook, Sec. 2.5.2"}, {"id": 69, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "Why are late-responding tissues often strongly affected by dose per fraction?", "options": {"A": "They cannot repair any damage", "B": "Their response depends only on total treatment time", "C": "They have substantial capacity to repair sublethal damage between small fractions", "D": "They are always acutely hypoxic"}, "correct": "C", "explanations": {"A": "Incorrect. Their high repair capacity is precisely why fraction size matters.", "B": "Incorrect. Total time is usually less dominant than fraction size for classic late effects.", "C": "Correct. Reducing fraction size allows more repair, so large fractions disproportionately increase late injury.", "D": "Incorrect. Hypoxia is not the universal explanation for late normal-tissue response."}, "source": "IAEA Handbook, Secs. 2.5.3 and 3.12.6"}, {"id": 70, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "A consequential late effect is:", "options": {"A": "Late damage arising from severe, unresolved early tissue injury", "B": "An immediate prodromal symptom", "C": "A hereditary mutation passed to offspring", "D": "A late effect completely unrelated to early reactions"}, "correct": "A", "explanations": {"A": "Correct. Persistent ulceration or severe acute mucosal injury can evolve into late structural damage.", "B": "Incorrect. Prodromal symptoms occur soon after whole-body exposure.", "C": "Incorrect. Heritable effects involve germ cells and descendants.", "D": "Incorrect. The defining feature is its causal connection to earlier injury."}, "source": "IAEA Handbook, Sec. 2.5.3"}, {"id": 71, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "In a serial organ such as the spinal cord, complication risk is often dominated by:", "options": {"A": "The mean dose to many independent functional units only", "B": "Damage to a small critical segment", "C": "The activity of the radiation source after treatment", "D": "Damage to one noncritical peripheral cell"}, "correct": "B", "explanations": {"A": "Incorrect. Mean-dose behavior is more characteristic of parallel organs.", "B": "Correct. Interruption of a serial chain can compromise the whole organ’s function.", "C": "Incorrect. Post-treatment source activity is irrelevant after external exposure ends.", "D": "Incorrect. A noncritical isolated cell is unlikely to determine organ failure."}, "source": "IAEA Handbook, Sec. 3.11.5"}, {"id": 72, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "In a parallel organ such as the lung, complication probability is often closely related to:", "options": {"A": "Whether one single airway epithelial cell survives", "B": "The volume or fraction of functional subunits irradiated", "C": "Only the maximum dose to one tiny point", "D": "The patient’s chromosome count"}, "correct": "B", "explanations": {"A": "Incorrect. Organ function depends on many subunits, not one cell.", "B": "Correct. Parallel organs can retain function if enough independent subunits are spared, making irradiated volume important.", "C": "Incorrect. A small hot spot is often less decisive than the volume exposed in a parallel organ.", "D": "Incorrect. Chromosome count does not define the dose-volume response."}, "source": "IAEA Handbook, Sec. 3.11.5"}, {"id": 73, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "TD5/5 refers approximately to a dose associated with:", "options": {"A": "Five radioactive decays in five seconds", "B": "A 50% tumour-control probability in 5 days", "C": "A 5 Gy dose delivered in 5 fractions", "D": "A 5% severe normal-tissue complication rate within 5 years"}, "correct": "D", "explanations": {"A": "Incorrect. It is not an activity measurement.", "B": "Incorrect. Tumour control uses terms such as TCD50.", "C": "Incorrect. The notation does not specify 5 Gy in 5 fractions.", "D": "Correct. TD5/5 is a historical normal-tissue tolerance concept based on about 5% complications by 5 years."}, "source": "IAEA Handbook, Sec. 3.1 and 3.11.6"}, {"id": 74, "section": "7. Normal Tissue Responses, Volume Effects and Therapeutic Ratio", "stem": "A favorable therapeutic ratio means that:", "options": {"A": "Normal tissue is more radiosensitive than the tumour at every dose", "B": "Tumour control can be achieved at doses causing acceptably low normal-tissue injury", "C": "The treatment produces no biological effect", "D": "Tumour-control and complication curves completely overlap"}, "correct": "B", "explanations": {"A": "Incorrect. That would generally make the ratio unfavorable.", "B": "Correct. The goal is separation between tumour-control and normal-tissue complication probabilities.", "C": "Incorrect. Effective treatment must produce tumour damage.", "D": "Incorrect. Overlapping curves provide little therapeutic window."}, "source": "IAEA Handbook, Secs. 2.5.5 and 3.11.6"}, {"id": 75, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "The main radiobiological advantage of fractionation for normal tissues is:", "options": {"A": "A guarantee of zero side effects", "B": "Repair of sublethal damage between fractions", "C": "Elimination of all tumour hypoxia after one fraction", "D": "Automatic increase in radiation LET"}, "correct": "B", "explanations": {"A": "Incorrect. Fractionation reduces but does not eliminate toxicity.", "B": "Correct. Interfraction repair can spare normal tissues, especially late-responding tissues.", "C": "Incorrect. Reoxygenation is progressive and not guaranteed after one fraction.", "D": "Incorrect. LET is determined by radiation quality, not fractionation."}, "source": "IAEA Handbook, Sec. 3.12.1"}, {"id": 76, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Which of the 5 Rs can reduce treatment effectiveness when overall treatment time becomes too long?", "options": {"A": "Reoxygenation", "B": "Redistribution into sensitive phases", "C": "Repopulation of surviving tumour clonogens", "D": "Repair in normal tissue"}, "correct": "C", "explanations": {"A": "Incorrect. Reoxygenation generally sensitizes surviving tumour cells.", "B": "Incorrect. Redistribution can increase the chance of irradiating cells in sensitive phases.", "C": "Correct. Tumour clonogens can proliferate during prolonged courses, requiring additional dose for control.", "D": "Incorrect. Normal-tissue repair is generally beneficial to the therapeutic ratio."}, "source": "IAEA Handbook, Sec. 3.12.2"}, {"id": 77, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Redistribution during fractionated radiotherapy refers to:", "options": {"A": "Changing absorbed dose into effective dose", "B": "Spreading radioactive material through the bloodstream", "C": "Surviving cells moving through the cell cycle so later fractions may encounter different sensitivities", "D": "Moving the treatment machine to another hospital"}, "correct": "C", "explanations": {"A": "Incorrect. Dose conversion is a calculation, not a cell-cycle phenomenon.", "B": "Incorrect. That describes radionuclide biodistribution, not the R of fractionation.", "C": "Correct. Cell-cycle progression between fractions changes the phase distribution of surviving cells.", "D": "Incorrect. This is logistical relocation, not radiobiological redistribution."}, "source": "IAEA Handbook, Sec. 3.12.3"}, {"id": 78, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "The 5 Rs of radiotherapy are:", "options": {"A": "Repair, resistance, radioactivity, recurrence, and remission", "B": "Repair, repopulation, redistribution, reoxygenation, and radiosensitivity", "C": "Risk, response, radon, radiation, and recovery", "D": "Range, recoil, reflection, refraction, and repair"}, "correct": "B", "explanations": {"A": "Incorrect. It omits key established Rs and includes nonstandard terms.", "B": "Correct. These five biological processes help explain responses to fractionated treatment.", "C": "Incorrect. This is not the standard radiobiological set.", "D": "Incorrect. Most listed terms are physical optics or interaction terms."}, "source": "IAEA Handbook, Sec. 3.12"}, {"id": 79, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Hyperfractionation generally uses:", "options": {"A": "Smaller doses per fraction, often more than one fraction per day, with an increased total number of fractions", "B": "No interval for repair", "C": "One very large fraction only", "D": "The same number of fractions delivered over a shorter time with unchanged fraction size only"}, "correct": "A", "explanations": {"A": "Correct. Hyperfractionation exploits greater repair in late-responding normal tissues by reducing fraction size.", "B": "Incorrect. Adequate interfraction time is needed to avoid incomplete repair.", "C": "Incorrect. That is extreme hypofractionation or stereotactic single-fraction treatment.", "D": "Incorrect. That more closely describes accelerated treatment."}, "source": "IAEA Handbook, Sec. 3.12.8"}, {"id": 80, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Hypofractionation means:", "options": {"A": "Only low-LET radiation at low dose rate", "B": "No radiation dose", "C": "More fractions with a smaller dose per fraction", "D": "Fewer fractions with a larger dose per fraction"}, "correct": "D", "explanations": {"A": "Incorrect. It is defined by schedule, not LET or dose rate alone.", "B": "Incorrect. Hypofractionation still delivers therapeutic radiation.", "C": "Incorrect. That describes hyperfractionation.", "D": "Correct. Hypofractionation reduces fraction number and increases dose per fraction."}, "source": "IAEA Handbook, Sec. 3.12.8"}, {"id": 81, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Accelerated fractionation primarily aims to:", "options": {"A": "Eliminate the need for any fractionation", "B": "Lower the total dose to zero", "C": "Increase late normal-tissue repair by lengthening treatment", "D": "Shorten overall treatment time to limit tumour repopulation"}, "correct": "D", "explanations": {"A": "Incorrect. Accelerated schedules still use multiple fractions.", "B": "Incorrect. A therapeutic dose is still required.", "C": "Incorrect. Lengthening treatment can allow more tumour repopulation.", "D": "Correct. Compressing the schedule reduces the time available for accelerated tumour-cell proliferation."}, "source": "IAEA Handbook, Sec. 3.12.8"}, {"id": 82, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "A low α/β ratio is characteristic of many:", "options": {"A": "Radioactive sources", "B": "Ionization chambers", "C": "Very early-reacting tissues only", "D": "Late-responding normal tissues"}, "correct": "D", "explanations": {"A": "Incorrect. α/β is a tissue-response parameter, not a source property.", "B": "Incorrect. It does not characterize detector hardware.", "C": "Incorrect. Early-responding tissues and many tumours tend to have higher α/β values.", "D": "Correct. Late-responding tissues show strong sensitivity to fraction size and typically have low α/β values."}, "source": "IAEA Handbook, Sec. 3.12.7"}, {"id": 83, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "For a treatment of n fractions of dose d, the standard BED expression without a time correction is:", "options": {"A": "BED = dose × tissue weighting factor", "B": "BED = n/d", "C": "BED = nd[1 + d/(α/β)]", "D": "BED = α + β"}, "correct": "C", "explanations": {"A": "Incorrect. Tissue weighting is used for effective dose, not therapeutic BED.", "B": "Incorrect. Dividing fraction number by dose has no BED meaning.", "C": "Correct. This follows from the linear-quadratic model for fractionated exposure.", "D": "Incorrect. α and β are model parameters, not simply added to obtain BED."}, "source": "IAEA Handbook, Sec. 3.12.7"}, {"id": 84, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "What is the BED for 10 fractions of 3 Gy if α/β = 10 Gy, ignoring time effects?", "options": {"A": "39 Gy", "B": "33 Gy", "C": "60 Gy", "D": "30 Gy"}, "correct": "A", "explanations": {"A": "Correct. BED = 10×3×[1 + 3/10] = 30×1.3 = 39 Gy.", "B": "Incorrect. The LQ correction is larger than 3 Gy in this example.", "C": "Incorrect. This result does not follow from the BED equation.", "D": "Incorrect. This is only the physical total dose nd."}, "source": "IAEA Handbook, Sec. 3.12.7"}, {"id": 85, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "An isoeffect curve connects fractionation schedules that:", "options": {"A": "Use the same photon energy regardless of biological effect", "B": "Have the same machine output only", "C": "Have identical treatment dates", "D": "Produce the same specified biological endpoint"}, "correct": "D", "explanations": {"A": "Incorrect. Same beam energy does not make schedules biologically equivalent.", "B": "Incorrect. Equal machine output does not guarantee equal tissue effect.", "C": "Incorrect. Calendar dates alone do not define isoeffect.", "D": "Correct. Isoeffect relationships compare different total doses, fraction sizes, numbers, or times that yield an equal biological effect."}, "source": "IAEA Handbook, Sec. 3.12.6"}, {"id": 86, "section": "8. Fractionation, Linear-Quadratic Model, BED and the 5 Rs", "stem": "Why is it radiobiologically preferable to treat all planned fields each day when using multiple fields?", "options": {"A": "To keep fraction contributions temporally close and allow more uniform repair assumptions across tissues", "B": "To eliminate the physical dose in normal tissue", "C": "Because isodose curves always equal isoeffect curves", "D": "To increase the LET of every beam"}, "correct": "A", "explanations": {"A": "Correct. Separating field contributions across days can create unequal effective fraction sizes and different repair at points on the same isodose line.", "B": "Incorrect. Normal tissue still receives dose.", "C": "Incorrect. Equal physical dose does not always mean equal biological effect.", "D": "Incorrect. Field timing does not change radiation LET."}, "source": "IAEA Handbook, Secs. 3.12.5-3.12.6"}, {"id": 87, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "Acute radiation syndrome (ARS) generally requires:", "options": {"A": "A tiny localized dose to one fingernail only", "B": "A relatively high dose to most or all of the body delivered over a short time", "C": "A very low dose spread uniformly over an entire lifetime", "D": "Only non-ionizing visible light exposure"}, "correct": "B", "explanations": {"A": "Incorrect. A small localized exposure may cause local injury but not classic ARS.", "B": "Correct. ARS follows substantial whole-body or large-volume penetrating exposure over a short interval.", "C": "Incorrect. Very low chronic exposure does not produce the acute syndrome.", "D": "Incorrect. Visible light does not cause ARS."}, "source": "Biological Effects slides, pp. 29 and 42-44; IAEA Handbook, Sec. 2.6.1"}, {"id": 88, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "The usual chronological sequence of ARS phases is:", "options": {"A": "Manifest illness → exposure → latent → prodromal", "B": "Latent → prodromal → recovery → exposure", "C": "Recovery → prodromal → exposure → death", "D": "Prodromal → latent → manifest illness → recovery or death"}, "correct": "D", "explanations": {"A": "Incorrect. Exposure occurs first and manifest illness later.", "B": "Incorrect. The prodromal phase precedes the latent phase.", "C": "Incorrect. Recovery cannot precede the exposure.", "D": "Correct. Early nausea and related symptoms may be followed by a temporary latent period, then organ-system illness."}, "source": "Biological Effects slides, p. 44"}, {"id": 89, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "The hematopoietic syndrome is caused primarily by:", "options": {"A": "Killing of bone-marrow stem and precursor cells, leading to depletion of blood elements", "B": "Only lens-protein coagulation", "C": "Immediate destruction of all neurons", "D": "Excess production of red blood cells"}, "correct": "A", "explanations": {"A": "Correct. Marrow failure causes infection, bleeding, and anemia because circulating cells are not replaced.", "B": "Incorrect. Lens injury causes cataract, not hematopoietic syndrome.", "C": "Incorrect. Rapid neurovascular injury occurs at much higher doses.", "D": "Incorrect. The problem is reduced, not excessive, blood-cell production."}, "source": "IAEA Handbook, Sec. 2.5.6"}, {"id": 90, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "Which dose range does the IAEA handbook associate approximately with human hematopoietic syndrome?", "options": {"A": "2-8 Gy", "B": "Above 100 Gy only", "C": "0.1-0.5 Gy", "D": "0.001-0.01 Gy"}, "correct": "A", "explanations": {"A": "Correct. The handbook gives an approximate range of 2-8 Gy in humans.", "B": "Incorrect. Hematopoietic syndrome occurs well below 100 Gy.", "C": "Incorrect. These doses may cause measurable blood changes but not typical severe hematopoietic syndrome.", "D": "Incorrect. This range is far below doses that cause marrow syndrome."}, "source": "IAEA Handbook, Sec. 2.5.6"}, {"id": 91, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "The gastrointestinal syndrome becomes prominent after high whole-body doses because of:", "options": {"A": "Improved electrolyte absorption", "B": "Excess growth of intestinal villi", "C": "Loss of intestinal crypt cells and mucosal barrier, causing fluid loss and infection", "D": "Only temporary hair loss"}, "correct": "C", "explanations": {"A": "Incorrect. Absorption and fluid balance worsen.", "B": "Incorrect. The villi and mucosal lining are depleted, not overgrown.", "C": "Correct. Destruction of rapidly renewing mucosa causes diarrhea, barrier failure, sepsis, and electrolyte imbalance.", "D": "Incorrect. Epilation is a skin effect and does not explain GI syndrome."}, "source": "IAEA Handbook, Secs. 2.5.6 and 4.3.3.4"}, {"id": 92, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "The neurovascular syndrome usually follows:", "options": {"A": "A small localized skin exposure", "B": "Very large whole-body doses and causes rapid neurological and cardiovascular collapse", "C": "Low chronic occupational doses only", "D": "A dose too low to cause any ionization"}, "correct": "B", "explanations": {"A": "Incorrect. Local skin exposure causes cutaneous injury rather than whole-body neurovascular syndrome.", "B": "Correct. At very high doses, severe vascular and neurological dysfunction can cause death within hours to days.", "C": "Incorrect. Low chronic doses do not cause neurovascular ARS.", "D": "Incorrect. Ionizing radiation by definition causes ionization."}, "source": "IAEA Handbook, Sec. 2.5.6"}, {"id": 93, "section": "9. Whole-body Exposure, Acute Radiation Syndrome and Accident Management", "stem": "Which symptom is useful in early radiation-accident triage because earlier onset generally suggests a higher dose?", "options": {"A": "A lifelong stable birthmark", "B": "Vomiting", "C": "Normal hair color", "D": "A healed fracture from years earlier"}, "correct": "B", "explanations": {"A": "Incorrect. A stable birthmark is unrelated to acute exposure.", "B": "Correct. Time to emesis is one rapid clinical indicator used with other findings to estimate severity.", "C": "Incorrect. Normal hair color is not an acute dosimeter.", "D": "Incorrect. An old healed fracture does not indicate recent radiation dose."}, "source": "IAEA Handbook, Sec. 4.3.4; Biological Effects slides, ARS section"}, {"id
