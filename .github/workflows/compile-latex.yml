name: Compile Nuclear Medicine LaTeX

on:
  push:
    paths:
      - "nuclear_medicine_activity_notes.tex"

permissions:
  contents: write

jobs:
  compile-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: nuclear_medicine_activity_notes.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nuclear_medicine_activity_notes.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes."
          else
            git commit -m "Compile Nuclear Medicine notes"
            git push
          fi
